name: Autopublish Articles

on:
  # Run daily at 9 AM UTC (adjust to your timezone)
  schedule:
    - cron: '0 9 * * *'

  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      article_count:
        description: 'Number of articles to generate (1-5)'
        required: false
        default: '1'
      run_trend_research:
        description: 'Run trend research first?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  autopublish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run trend research (if enabled)
        if: github.event.inputs.run_trend_research == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/trend-research.js --count 10

      - name: Generate articles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          COUNT="${{ github.event.inputs.article_count || '1' }}"
          node scripts/autopublish.js --count "$COUNT"

      - name: Build site
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: npm run build

      - name: Commit new articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sites/ src/content/ dist/
          if git diff --staged --quiet; then
            echo "No new articles to commit"
          else
            ARTICLE_COUNT=$(git diff --staged --name-only | grep -c '\.md$' || true)
            git commit -m "autopublish: add ${ARTICLE_COUNT} new article(s)

            Generated via autopublish workflow"
            git push
          fi

      - name: Trigger Netlify deploy
        if: env.NETLIFY_BUILD_HOOK != ''
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: curl -X POST -d '{}' "$NETLIFY_BUILD_HOOK"

  # Weekly trend research — discovers new keywords automatically
  trend-research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Run every Monday at 8 AM UTC
    if: github.event_name == 'schedule' && github.event.schedule == '0 9 * * 1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Research trending topics
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/trend-research.js --count 15

      - name: Commit new keywords
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sites/
          if git diff --staged --quiet; then
            echo "No new keywords to commit"
          else
            git commit -m "trend-research: add new keyword ideas

            Auto-discovered via weekly trend research"
            git push
          fi
